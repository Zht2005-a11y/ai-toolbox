<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库问答 · AI 工具箱</title>
<meta name="description" content="上传 PDF、TXT、Markdown 文档，AI 基于文档原文精准回答问题并标注来源。免费在线知识库问答工具，文档在浏览器本地解析，无需上传服务器。">
<meta property="og:type" content="website">
<meta property="og:title" content="知识库问答 · 基于你的文档回答问题">
<meta property="og:description" content="上传 PDF / TXT / Markdown，对着文档提问，AI 基于原文作答并标注来源。免费，打开即用。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#f6f7fb;--card:#fff;--ink:#1a1d29;--sub:#6b7280;--line:#e7e9f0;
    --brand:#5b6cff;--brand2:#8b5cf6;--brand-grad:linear-gradient(135deg,#5b6cff,#8b5cf6);
    --ok:#16a34a;--warn:#d97706;--err:#dc2626;--radius:18px;
    --shadow:0 10px 30px rgba(20,24,60,.08);--shadow-sm:0 4px 14px rgba(20,24,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .back{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
  .back:hover{color:var(--brand)}
  .logo{font-weight:800;font-size:16px;letter-spacing:-.3px}
  .logo .mark{color:var(--brand)}

  .page{padding:28px 0 60px}
  .page-head{margin-bottom:24px}
  .page-head h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
  .page-head .sub{color:var(--sub);font-size:14.5px}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}

  /* 左侧知识库 */
  .side{padding:22px}
  .side h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .drop{
    border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;
    cursor:pointer;transition:.18s;color:var(--sub);font-size:14px;
  }
  .drop:hover,.drop.drag{border-color:var(--brand);background:#f7f8ff;color:var(--brand)}
  .drop .big{font-size:28px;margin-bottom:6px}
  .drop b{color:var(--ink)}
  .hint{font-size:12px;color:#9aa1b2;margin-top:10px;text-align:center}
  input[type=file]{display:none}

  .docs{margin-top:16px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
  .doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
  .doc .fi{font-size:18px}
  .doc .meta{flex:1;min-width:0}
  .doc .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .st{font-size:12px;color:var(--sub)}
  .doc .del{background:none;border:none;color:#c0c4cf;cursor:pointer;font-size:16px;padding:2px 4px}
  .doc .del:hover{color:var(--err)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .badge.ok{background:#e8f7ee;color:var(--ok)}
  .badge.load{background:#fef3e2;color:var(--warn)}

  .side-tip{margin-top:14px;font-size:12px;color:#9aa1b2;line-height:1.5;background:#f7f8fb;border-radius:10px;padding:10px 12px}

  /* 右侧对话 */
  .chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:520px;overflow:hidden}
  .chat-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .chat-head .t{font-weight:800;font-size:15px}
  .clear{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer}
  .clear:hover{color:var(--err)}

  .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg .bubble{padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .msg.ai .bubble{background:#f4f5f9;border-bottom-left-radius:6px}
  .msg.user .bubble{background:var(--brand-grad);color:#fff;border-bottom-right-radius:6px}
  .msg.ai .avatar,.msg.user .avatar{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
  .msg.ai .avatar{background:#eef0ff}
  .msg.user .avatar{background:var(--brand-grad);color:#fff}

  .cite-mini{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .cite-chip{display:inline-flex;align-items:center;gap:3px;background:#eef0ff;color:var(--brand);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b4b9c6;text-align:center;padding:30px}
  .empty .big{font-size:44px;margin-bottom:12px}
  .empty p{font-size:14px;max-width:300px;line-height:1.6}

  .composer{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;resize:none;outline:none;height:48px;max-height:140px;line-height:1.5}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.12)}
  .send{width:48px;height:48px;border-radius:14px;background:var(--brand-grad);color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0;transition:.18s;display:flex;align-items:center;justify-content:center}
  .send:hover{filter:brightness(1.06)}
  .send:disabled{opacity:.4;cursor:not-allowed}

  .typing{display:flex;gap:5px;padding:6px 0}
  .typing span{width:7px;height:7px;border-radius:50%;background:#b8bdcc;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;transition:.3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="back" href="index.html">← 返回首页</a>
    <div class="logo"><span class="mark">✦</span> 知识库问答</div>
    <div style="width:70px"></div>
  </div>
</header>

<div class="wrap page">
  <div class="page-head">
    <h1>📚 知识库问答（RAG）</h1>
    <div class="sub">上传文档，AI 将基于你的资料精准回答，并标注引用来源。</div>
  </div>

  <div class="layout">
    <div class="card side">
      <h3>📁 我的文档</h3>
      <div class="drop" id="dropZone">
        <div class="big">📄</div>
        <div>点击或拖拽上传 <b>PDF / TXT</b></div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.txt,.md" multiple>
      <div class="hint">支持 PDF、TXT、Markdown，单个 ≤ 10MB</div>
      <div class="docs" id="docList"></div>
      <div class="side-tip">💡 文档仅在浏览器本地解析，检索命中的片段会随问题一起发送给 AI 用于回答，并标注来源。</div>
    </div>

    <div class="card chat">
      <div class="chat-head">
        <span class="t">💬 问答对话</span>
        <button class="clear" id="clearChat">清空对话</button>
      </div>
      <div class="msgs" id="msgs">
        <div class="empty" id="empty">
          <div class="big">🔍</div>
          <p>上传文档后，在下方输入你的问题<br>AI 会从文档中检索相关内容并回答</p>
        </div>
      </div>
      <div class="composer">
        <textarea id="input" placeholder="输入你的问题，例如：这份文档主要讲了什么？" rows="1"></textarea>
        <button class="send" id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== AI 通过本地后端代理调用 Agnes（Key 在服务器端，不暴露给前端） =====
const AI_MODEL = 'agnes-3.0-flash';

// ===== 状态 =====
let docs = [];        // {id, name, type, status, chunks:[{text, src}]}

// ===== 工具函数 =====
function toast(msg, type){
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = type === 'error' ? 'var(--err)' : (type === 'warn' ? 'var(--warn)' : 'var(--brand)');
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = '0', 2800);
}

function autoResize(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
}

// ===== 文档解析 =====
async function loadPdfText(file){
  const url = URL.createObjectURL(file);
  try {
    const pdfjsLib = window.pdfjsLib;
    if (!pdfjsLib) throw new Error('pdf');
    const pdf = await pdfjsLib.getDocument(url).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function loadPdfLib(){
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('pdf 解析库加载失败，请检查网络'));
    document.head.appendChild(s);
  });
}

function chunkText(text, size = 600, overlap = 80){
  text = text.replace(/\r\n/g, '\n').replace(/[ \t]+/g, ' ').trim();
  if (!text) return [];
  const chunks = [];
  // 优先按段落切分，长段落再按长度切
  const paragraphs = text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 0);
  let buf = '';
  const flush = () => {
    if (buf.trim()) chunks.push(buf.trim());
    buf = '';
  };
  for (const p of paragraphs) {
    if (p.length > size) {
      flush();
      let start = 0;
      while (start < p.length) {
        chunks.push(p.slice(start, start + size));
        start += size - overlap;
      }
    } else {
      if ((buf + '\n' + p).length > size) flush();
      buf = buf ? buf + '\n' + p : p;
    }
  }
  flush();
  return chunks.map(t => ({ text: t, src: '' }));
}

async function handleFiles(files){
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','txt','md'].includes(ext)) { toast('仅支持 PDF/TXT/MD', 'warn'); continue; }
    if (file.size > 10 * 1024 * 1024) { toast(`"${file.name}" 超过 10MB`, 'warn'); continue; }
    const id = Date.now() + '' + Math.random().toString(36).slice(2,7);
    docs.push({ id, name: file.name, type: ext, status: 'loading', chunks: [] });
    renderDocs();
    try {
      let text;
      if (ext === 'pdf') {
        try { await loadPdfLib(); text = await loadPdfText(file); }
        catch(e){ throw new Error('PDF 解析失败，请换用 TXT 试试'); }
      } else {
        text = await file.text();
      }
      const chunks = chunkText(text);
      if (chunks.length === 0) throw new Error('未能提取到文本内容');
      chunks.forEach(c => c.src = file.name);
      const doc = docs.find(d => d.id === id);
      doc.chunks = chunks;
      doc.status = 'done';
    } catch(e) {
      const doc = docs.find(d => d.id === id);
      doc.status = 'error';
      doc.error = e.message;
    }
    renderDocs();
  }
}

function renderDocs(){
  const list = document.getElementById('docList');
  const emoji = { pdf:'📕', txt:'📄', md:'📘' };
  list.innerHTML = docs.map(d => `
    <div class="doc">
      <span class="fi">${emoji[d.type] || '📄'}</span>
      <div class="meta">
        <div class="nm">${d.name}</div>
        <div class="st">${
          d.status === 'loading' ? '<span class="badge load">解析中…</span>' :
          d.status === 'done' ? `<span class="badge ok">${d.chunks.length} 段 · 已就绪</span>` :
          `<span style="color:var(--err)">${d.error || '解析失败'}</span>`
        }</div>
      </div>
      <button class="del" onclick="removeDoc('${d.id}')">×</button>
    </div>
  `).join('');
}

function removeDoc(id){
  docs = docs.filter(d => d.id !== id);
  renderDocs();
}

function totalChunks(){ return docs.reduce((n,d) => n + d.chunks.length, 0); }

// ===== 检索 =====
function tokenize(s){
  return (s.toLowerCase().match(/[\u4e00-\u9fa5]|[a-z0-9]+/g) || []);
}
function search(query, topK = 4){
  const qTokens = new Set(tokenize(query));
  const scored = [];
  for (const d of docs) {
    if (d.status !== 'done') continue;
    for (const c of d.chunks) {
      let score = 0;
      const cTokens = tokenize(c.text);
      const cSet = new Set(cTokens);
      for (const t of qTokens) {
        if (cSet.has(t)) score += 2;
        else if (c.text.toLowerCase().includes(t)) score += 1;
      }
      if (score > 0) scored.push({ text: c.text, src: c.src, score });
    }
  }
  scored.sort((a,b) => b.score - a.score);
  return scored.slice(0, topK);
}

// ===== 对话 =====
function addMsg(role, content, cites){
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'ai' ? '✦' : '我';
  let citesHtml = '';
  if (cites && cites.length) {
    // 紧凑来源：去重后只显示文件名胶囊
    const names = [...new Set(cites.map(c => c.src))];
    citesHtml = '<div class="cite-mini">' + names.map(n =>
      `<span class="cite-chip">📎 ${escapeHtml(n)}</span>`
    ).join('') + '</div>';
  }
  div.innerHTML = `<div class="avatar">${avatar}</div><div><div class="bubble"></div>${citesHtml}</div>`;
  const bubble = div.querySelector('.bubble');
  bubble.textContent = content;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addTyping(){
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = '<div class="avatar">✦</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping(){
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function ask(){
  const input = document.getElementById('input');
  const q = input.value.trim();
  if (!q) return;
  if (totalChunks() === 0) { toast('请先上传文档', 'warn'); return; }

  input.value = '';
  autoResize(input);
  addMsg('user', q);

  // 检索
  const hits = search(q, 4);
  const cites = hits.map(h => ({ src: h.src, text: h.text }));

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  addTyping();

  let context = hits.map((h,i) => `[资料${i+1} 来源:${h.src}]\n${h.text}`).join('\n\n');
  const systemPrompt = '你是知识库问答助手。请严格基于用户提供的【资料】内容回答问题，用简体中文，条理清晰。若资料不足以回答，请明确说明"资料中未找到相关内容"，不要编造。回答末尾不要重复引用。';
  const messages = [
    { role: 'system', content: systemPrompt },
    { role: 'user', content: `【资料】\n${context}\n\n【问题】\n${q}` }
  ];

  removeTyping();
  const bubble = addMsg('ai', '', cites.length ? cites : null);

  try {
    let full = '';
    await streamChat(messages, (delta) => {
      full += delta;
      bubble.textContent = full;
      const msgs = document.getElementById('msgs');
      msgs.scrollTop = msgs.scrollHeight;
    });
    if (!full) bubble.textContent = '（模型未返回内容，请重试）';
  } catch(e) {
    bubble.textContent = '请求失败：' + (e.message || '网络错误');
    bubble.style.color = 'var(--err)';
  } finally {
    sendBtn.disabled = false;
  }
}

// 通过本地后端代理调用 Agnes（流式 SSE）
async function streamChat(messages, onDelta){
  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, stream: true })
  });

  if (!resp.ok) {
    let msg = '请求失败（' + resp.status + '）';
    try {
      const j = await resp.json();
      msg = j.error || j.detail || msg;
    } catch(e) {}
    throw new Error(msg);
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    // 按 SSE 帧解析
    const lines = buf.split('\n');
    buf = lines.pop() || ''; // 最后一行可能不完整，留到下次

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || !trimmed.startsWith('data:')) continue;
      const data = trimmed.slice(5).trim();
      if (data === '[DONE]') return;
      try {
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) onDelta(delta);
      } catch(e) {
        // 忽略无法解析的帧
      }
    }
  }
}

function clearChat(){
  const msgs = document.getElementById('msgs');
  msgs.innerHTML = `<div class="empty" id="empty"><div class="big">🔍</div><p>上传文档后，在下方输入你的问题<br>AI 会从文档中检索相关内容并回答</p></div>`;
}

// ===== 事件绑定 =====
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { handleFiles(e.target.files); e.target.value=''; });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

const input = document.getElementById('input');
input.addEventListener('input', () => autoResize(input));
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.getElementById('sendBtn').addEventListener('click', ask);
document.getElementById('clearChat').addEventListener('click', clearChat);
</script>
</body>
</html>
