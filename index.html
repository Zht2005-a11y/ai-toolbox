<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具箱 · 知识库问答 + 周报生成</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --ink:#1a1d29;
    --sub:#6b7280;
    --line:#e7e9f0;
    --brand:#5b6cff;
    --brand2:#8b5cf6;
    --brand-grad:linear-gradient(135deg,#5b6cff 0%,#8b5cf6 100%);
    --ok:#16a34a;
    --warn:#d97706;
    --err:#dc2626;
    --radius:18px;
    --shadow:0 10px 30px rgba(20,24,60,.08);
    --shadow-sm:0 4px 14px rgba(20,24,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ===== 顶部 ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(91,108,255,.35)}
  .nav-right{display:flex;align-items:center;gap:10px}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-size:14px;font-weight:600;border-radius:12px;padding:10px 18px;transition:.18s;font-family:inherit}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 6px 16px rgba(91,108,255,.32)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ===== Hero ===== */
  .hero{padding:56px 0 40px;text-align:center}
  .hero .badge{display:inline-flex;align-items:center;gap:6px;background:#eef0ff;color:var(--brand);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:18px}
  .hero h1{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-bottom:16px}
  .hero h1 .grad{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--sub);font-size:17px;max-width:560px;margin:0 auto}

  /* ===== 功能卡片 ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding-bottom:60px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .feature{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px;cursor:pointer;position:relative;overflow:hidden;
    box-shadow:var(--shadow-sm);transition:.22s;text-align:left;display:block;text-decoration:none;color:inherit;
  }
  .feature:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#d7dcff}
  .feature .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
  .f-rag .icon{background:#eef0ff}
  .f-report .icon{background:#fdf1e6}
  .feature h2{font-size:21px;font-weight:800;margin-bottom:8px;letter-spacing:-.3px}
  .feature .desc{color:var(--sub);font-size:14.5px;margin-bottom:18px;min-height:44px}
  .feature .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;font-weight:600;color:var(--sub);background:#f4f5f9;padding:4px 10px;border-radius:8px}
  .feature .go{position:absolute;right:26px;bottom:26px;font-size:13px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:4px}

  footer{text-align:center;color:#9aa1b2;font-size:13px;padding:30px 0 50px}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="logo"><span class="mark">✦</span>AI 工具箱</div>
    <div class="nav-right">
      <span class="user-chip" style="display:flex">✨ 免登录 · 打开即用</span>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="badge">✨ 两个实用 AI 工具 · 免配置直接上手</div>
    <h1>让 AI 帮你<br><span class="grad">读懂文档、写好周报</span></h1>
    <p>上传文档就能问答，写流水账就能生成周报。无需任何 API Key，打开即用。</p>
  </section>

  <section class="grid">
    <a class="feature f-rag" href="javascript:void(0)" onclick="openRag()">
      <div class="icon">📚</div>
      <h2>知识库问答（RAG）</h2>
      <div class="desc">上传 PDF / TXT 文档，针对文档内容提问，AI 基于你的资料精准回答，并标注引用来源。</div>
      <div class="tags"><span class="tag">文档解析</span><span class="tag">智能检索</span><span class="tag">引用溯源</span></div>
      <span class="go">立即使用 →</span>
    </a>
    <a class="feature f-report" href="javascript:void(0)" onclick="openReport()">
      <div class="icon">📝</div>
      <h2>AI 周报生成器</h2>
      <div class="desc">把一周的流水账丢进来，AI 帮你整理成结构清晰、重点突出的周报，一键复制。</div>
      <div class="tags"><span class="tag">流水账→周报</span><span class="tag">多种风格</span><span class="tag">一键复制</span></div>
      <span class="go">立即使用 →</span>
    </a>
  </section>
</div>

<footer>AI 工具箱 · 免登录直接使用 · 基于 Agnes AI 模型</footer>

<script>
function openRag(){ location.href = 'rag.html'; }
function openReport(){ location.href = 'report.html'; }
</script>
</body>
</html>
