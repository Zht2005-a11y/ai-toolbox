<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 · AI 工具箱</title>
<meta name="description" content="忘记密码？输入注册邮箱获取验证码，即可重置 AI 工具箱账号密码。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#f6f7fb;--card:#fff;--ink:#1a1d29;--sub:#6b7280;--line:#e7e9f0;
    --brand:#5b6cff;--brand2:#8b5cf6;--brand-grad:linear-gradient(135deg,#5b6cff,#8b5cf6);
    --ok:#16a34a;--warn:#d97706;--err:#dc2626;--radius:18px;
    --shadow:0 10px 30px rgba(20,24,60,.08);--shadow-sm:0 4px 14px rgba(20,24,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px;text-decoration:none;color:var(--ink)}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(91,108,255,.35)}
  .back{font-size:14px;font-weight:600;color:var(--sub);text-decoration:none}
  .back:hover{color:var(--brand)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .panel{width:100%;max-width:420px}
  .panel-head{text-align:center;margin-bottom:26px}
  .panel-head h1{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:8px}
  .panel-head p{color:var(--sub);font-size:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}

  .steps{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#b4b9c6;margin-bottom:20px}
  .steps .s{display:flex;align-items:center;gap:6px}
  .steps .s.on{color:var(--brand)}
  .steps .n{width:20px;height:20px;border-radius:50%;background:#f0f1f6;display:flex;align-items:center;justify-content:center;font-size:11px}
  .steps .s.on .n{background:var(--brand-grad);color:#fff}
  .steps .line{flex:1;height:1px;background:var(--line)}

  label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px}
  .field{margin-bottom:16px}
  input{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:14.5px;font-family:inherit;outline:none;transition:.16s;background:#fff;color:var(--ink);
  }
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.12)}
  input:disabled{background:#f7f8fb;color:var(--sub)}
  .hint{font-size:12px;color:#9aa1b2;margin-top:6px}

  .code-field{display:flex;gap:10px}
  .code-field input{flex:1;letter-spacing:6px;font-size:18px;font-weight:800;text-align:center}
  .resend{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer;font-family:inherit;white-space:nowrap}
  .resend:hover{border-color:var(--brand)}
  .resend:disabled{color:#b4b9c6;cursor:not-allowed}

  .submit{
    width:100%;padding:13px;border:none;border-radius:12px;background:var(--brand-grad);
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 16px rgba(91,108,255,.3);transition:.18s;margin-top:4px;
  }
  .submit:hover{filter:brightness(1.06)}
  .submit:disabled{opacity:.55;cursor:not-allowed}

  .msg{margin-top:14px;font-size:13.5px;font-weight:600;text-align:center;min-height:20px}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--ok)}

  .notice{margin-top:14px;font-size:12.5px;line-height:1.6;background:#f7f8fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--sub);display:none}
  .notice.on{display:block}
  .notice b{color:var(--ink)}
  .notice .code{display:inline-block;margin:6px 0;font-size:20px;font-weight:800;letter-spacing:5px;color:var(--brand)}
  .notice a{color:var(--brand);word-break:break-all}

  .alt{margin-top:18px;text-align:center;font-size:13.5px;color:var(--sub)}
  .alt a{color:var(--brand);font-weight:700;text-decoration:none}

  footer{text-align:center;color:#9aa1b2;font-size:13px;padding:24px 0 40px}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="index.html"><span class="mark">✦</span>AI 工具箱</a>
    <a class="back" href="login.html">← 返回登录</a>
  </div>
</header>

<main>
  <div class="panel">
    <div class="panel-head">
      <h1 id="pageTitle">重置密码</h1>
      <p id="pageSub">输入注册邮箱，我们会发一个验证码给你</p>
    </div>

    <div class="card">
      <div class="steps">
        <span class="s on" id="st1"><span class="n">1</span>验证邮箱</span>
        <span class="line"></span>
        <span class="s" id="st2"><span class="n">2</span>设置新密码</span>
      </div>

      <!-- 第 1 步 -->
      <form id="formRequest" onsubmit="return requestCode(event)">
        <div class="field">
          <label for="email">邮箱</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button class="submit" id="requestBtn" type="submit">获取重置验证码</button>
        <div class="msg" id="msg1"></div>
      </form>

      <div class="notice" id="devBox"></div>

      <!-- 第 2 步 -->
      <form id="formReset" style="display:none" onsubmit="return doReset(event)">
        <div class="field" id="emailField">
          <label for="email2">邮箱</label>
          <input type="email" id="email2" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field" id="codeField">
          <label for="code">验证码</label>
          <div class="code-field">
            <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code">
            <button class="resend" type="button" id="resendBtn" onclick="resend()">重新发送</button>
          </div>
          <div class="hint" id="expireHint">验证码 15 分钟内有效</div>
        </div>
        <div class="field">
          <label for="password">新密码</label>
          <input type="password" id="password" placeholder="至少 6 位" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="password2">确认新密码</label>
          <input type="password" id="password2" placeholder="再输入一次" autocomplete="new-password" required>
        </div>
        <button class="submit" id="resetBtn" type="submit">重 置 密 码</button>
        <div class="msg" id="msg2"></div>
      </form>

      <div class="alt"><a href="login.html">想起来了？返回登录</a></div>
    </div>
  </div>
</main>

<footer>AI 工具箱 · 知识库问答 + 周报生成</footer>

<script>
const params = new URLSearchParams(location.search);
const token = (params.get('token') || '').trim();
const next = /^[a-zA-Z0-9_-]+\.html$/.test(params.get('next') || '') ? params.get('next') : 'rag.html';

const $ = (id) => document.getElementById(id);

function setMsg(id, text, type){
  const el = $(id);
  el.textContent = text || '';
  el.className = 'msg' + (type ? ' ' + type : '');
}

function gotoStep(step){
  $('formRequest').style.display = step === 1 ? 'block' : 'none';
  $('formReset').style.display = step === 2 ? 'block' : 'none';
  $('st1').classList.toggle('on', step === 1);
  $('st2').classList.toggle('on', step === 2);
  $('pageSub').textContent = step === 1
    ? '输入注册邮箱，我们会发一个验证码给你'
    : '验证码已就绪，设置一个新的登录密码';
}

function showNotice(html){
  const box = $('devBox');
  box.innerHTML = html;
  box.classList.add('on');
}

// 邮件链接直达：先校验 token 是否还有效
(async () => {
  if (!token) return;
  try {
    const r = await fetch('/api/auth/reset/check?token=' + encodeURIComponent(token));
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      setMsg('msg1', d.error || '链接无效或已过期，请重新申请', 'err');
      return;
    }
    $('pageTitle').textContent = '设置新密码';
    $('emailField').style.display = 'none';
    $('codeField').style.display = 'none';
    $('email2').value = d.email || '';
    gotoStep(2);
  } catch (e) {
    setMsg('msg1', '网络异常：' + (e.message || '请重试'), 'err');
  }
})();

let cooldownTimer = null;
function startCooldown(){
  const btn = $('resendBtn');
  let left = 60;
  btn.disabled = true;
  clearInterval(cooldownTimer);
  cooldownTimer = setInterval(() => {
    left--;
    btn.textContent = left > 0 ? `${left}s` : '重新发送';
    if (left <= 0) { clearInterval(cooldownTimer); btn.disabled = false; }
  }, 1000);
}

async function requestCode(e){
  e.preventDefault();
  const email = $('email').value.trim();
  const btn = $('requestBtn');
  if (!email) { setMsg('msg1', '请填写邮箱', 'err'); return false; }

  btn.disabled = true;
  btn.textContent = '发送中…';
  setMsg('msg1', '');

  try {
    const res = await fetch('/api/auth/forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      setMsg('msg1', data.error || '发送失败，请稍后重试', 'err');
      btn.disabled = false;
      btn.textContent = '获取重置验证码';
      return false;
    }

    if (data.emailed) {
      showNotice('✅ 验证码邮件已发送到 <b>' + email + '</b>，15 分钟内有效。没收到？看看垃圾箱。');
    } else if (data.devCode) {
      // 服务未配置邮件：直接把验证码与链接显示出来，方便自部署使用
      showNotice(
        '⚠️ 该服务未配置邮件发送，已生成本地验证码：<br>' +
        '<span class="code">' + data.devCode + '</span><br>' +
        '也可以直接<a href="' + data.devLink + '">点这个链接</a>重置。'
      );
    } else {
      showNotice('如果该邮箱已注册，验证码已发出，请注意查收（含垃圾箱）。');
    }

    $('email2').value = email;
    gotoStep(2);
    startCooldown();
    btn.disabled = false;
    btn.textContent = '重新获取验证码';
  } catch (err) {
    setMsg('msg1', '网络异常：' + (err.message || '请重试'), 'err');
    btn.disabled = false;
    btn.textContent = '获取重置验证码';
  }
  return false;
}

async function resend(){
  const email = $('email2').value.trim();
  if (!email) { setMsg('msg2', '请填写邮箱', 'err'); return; }
  const btn = $('resendBtn');
  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    const res = await fetch('/api/auth/forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { setMsg('msg2', data.error || '发送失败', 'err'); btn.disabled = false; btn.textContent = '重新发送'; return; }
    setMsg('msg2', '验证码已重新发送', 'ok');
    if (data.devCode) showNotice('⚠️ 未配置邮件，新的验证码：<br><span class="code">' + data.devCode + '</span>');
    startCooldown();
  } catch (e) {
    setMsg('msg2', '网络异常：' + (e.message || '请重试'), 'err');
    btn.disabled = false;
    btn.textContent = '重新发送';
  }
}

async function doReset(e){
  e.preventDefault();
  const password = $('password').value;
  const password2 = $('password2').value;
  const btn = $('resetBtn');

  if (password.length < 6) { setMsg('msg2', '密码至少 6 位', 'err'); return false; }
  if (password !== password2) { setMsg('msg2', '两次输入的密码不一致', 'err'); return false; }

  const body = token
    ? { token, password }
    : { email: $('email2').value.trim(), code: $('code').value.trim(), password };

  if (!token) {
    if (!body.email) { setMsg('msg2', '请填写邮箱', 'err'); return false; }
    if (!body.code) { setMsg('msg2', '请填写验证码', 'err'); return false; }
  }

  btn.disabled = true;
  btn.textContent = '重置中…';
  setMsg('msg2', '');

  try {
    const res = await fetch('/api/auth/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      setMsg('msg2', data.error || '重置失败，请稍后重试', 'err');
      btn.disabled = false;
      btn.textContent = '重 置 密 码';
      return false;
    }

    setMsg('msg2', '密码已重置，正在前往登录页…', 'ok');
    $('devBox').classList.remove('on');
    setTimeout(() => { location.href = 'login.html?reset=1&next=' + encodeURIComponent(next); }, 700);
  } catch (err) {
    setMsg('msg2', '网络异常：' + (err.message || '请重试'), 'err');
    btn.disabled = false;
    btn.textContent = '重 置 密 码';
  }
  return false;
}
</script>
</body>
</html>
